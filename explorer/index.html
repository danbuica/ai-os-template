<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI OS Explorer</title>
<meta name="description" content="A 3D model of your company's AI OS: what's in it, who can change what, and how it works.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%231F5C4F%22/%3E%3Crect x=%229%22 y=%2213%22 width=%225%22 height=%227%22 rx=%222.5%22 fill=%22%239FE6CF%22/%3E%3Crect x=%2218%22 y=%2213%22 width=%225%22 height=%227%22 rx=%222.5%22 fill=%22%239FE6CF%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --air: #ECE6DE;
    --paper: rgba(252, 253, 252, 0.94);
    --paper-solid: #FCFDFC;
    --ink: #1D2430;
    --ink-2: #566170;
    --ink-3: #8A94A1;
    --line: rgba(29, 36, 48, 0.10);
    --line-2: rgba(29, 36, 48, 0.16);
    --pine: #1F5C4F;
    --pine-2: #2C7A69;
    --pine-soft: #E1ECE7;
    --saffron: #F2B33D;
    --saffron-soft: #FBEFD5;
    --cherry: #D64550;
    --cherry-soft: #F8E1E3;
    --shadow: 0 1px 2px rgba(29, 36, 48, 0.06), 0 10px 30px rgba(29, 36, 48, 0.10);
    --shadow-lift: 0 2px 4px rgba(29, 36, 48, 0.08), 0 16px 40px rgba(29, 36, 48, 0.14);
    --font: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--air);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }

  /* ---------- Stage ---------- */
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  /* ---------- Top bar ---------- */
  .bar {
    position: fixed; top: 14px; left: 14px; right: 14px; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 16px 9px 10px;
    background: var(--paper); border-radius: 16px; box-shadow: var(--shadow);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    min-width: 0;
  }
  .mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: var(--pine); position: relative;
  }
  .mark::before, .mark::after {
    content: ""; position: absolute; top: 14px; width: 5px; height: 7px; border-radius: 3px; background: #9FE6CF;
  }
  .mark::before { left: 10px; } .mark::after { right: 10px; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.3; white-space: nowrap; }
  .power {
    margin-left: auto; border: 0; cursor: pointer; display: flex; align-items: center; gap: 8px;
    background: var(--paper); box-shadow: var(--shadow); border-radius: 14px; padding: 12px 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 14px; font-weight: 550; color: var(--ink-2);
  }
  /* A small switch: grey and off, or green and on */
  .power::before { content: ""; flex: none; width: 28px; height: 16px; border-radius: 8px; background: radial-gradient(circle at 8px 8px, #fff 5px, transparent 5.5px) rgba(29,36,48,.2); }
  .power[aria-pressed="true"] { color: var(--pine); }
  .power[aria-pressed="true"]::before { background: radial-gradient(circle at 20px 8px, #fff 5px, transparent 5.5px) var(--pine-2); }
  .power:hover { color: var(--ink); }
  .modes {
    display: flex; gap: 4px; padding: 4px;
    background: var(--paper); border-radius: 14px; box-shadow: var(--shadow);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .modes button {
    border: 0; background: transparent; padding: 8px 16px; border-radius: 10px; cursor: pointer;
    font-weight: 550; color: var(--ink-2); transition: background .2s, color .2s;
  }
  .modes button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .modes button:not([aria-selected="true"]):hover { background: rgba(29,36,48,.06); color: var(--ink); }
  .ghost {
    border: 0; background: var(--paper); box-shadow: var(--shadow); border-radius: 14px;
    padding: 12px 14px; cursor: pointer; font-weight: 550; color: var(--ink-2);
    display: flex; align-items: center; gap: 8px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .ghost:hover { color: var(--ink); }
  .ghost svg { width: 18px; height: 18px; }

  .notice {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 15;
    background: var(--saffron-soft); color: #5B4410; border: 1px solid rgba(160, 110, 10, .18);
    padding: 9px 16px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow);
    max-width: calc(100vw - 28px); text-align: center;
  }
  .notice b { font-weight: 650; }

  /* ---------- 3D labels ---------- */
  .tag {
    pointer-events: auto; cursor: pointer; border: 0;
    display: flex; flex-direction: column; align-items: flex-start; gap: 0;
    padding: 7px 12px 8px; border-radius: 12px;
    background: rgba(252, 253, 252, 0.92); box-shadow: var(--shadow);
    text-align: left; white-space: nowrap;
    transition: translate .18s ease, box-shadow .18s ease, opacity .3s ease;
  }
  .tag b { font-size: 14px; font-weight: 650; letter-spacing: -0.005em; line-height: 1.25; }
  .tag span { font-size: 12px; color: var(--ink-2); line-height: 1.3; }
  .tag:hover { translate: 0 -2px; box-shadow: var(--shadow-lift); }
  .tag.on { box-shadow: 0 0 0 2px var(--pine), var(--shadow-lift); }
  body.story .tag { opacity: .55; }
  body.story .tag.on { opacity: 1; }
  .mini {
    pointer-events: none; font-size: 11.5px; font-weight: 550; color: var(--ink);
    background: rgba(252,253,252,.9); padding: 2px 8px; border-radius: 7px;
    box-shadow: 0 1px 2px rgba(29,36,48,.10); white-space: nowrap;
    opacity: 0; transition: opacity .3s ease;
  }
  .mini.company { color: var(--pine); }
  .mini.admin::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pine); margin-right: 5px; vertical-align: 1px; }
  .bubble {
    pointer-events: none; max-width: 240px; white-space: normal;
    font-size: 14px; line-height: 1.35; font-weight: 500;
    background: var(--paper-solid); color: var(--ink);
    padding: 9px 13px; border-radius: 14px 14px 14px 4px; box-shadow: var(--shadow-lift);
    animation: pop .35s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .chip {
    pointer-events: none; white-space: nowrap; font-size: 13px; font-weight: 600;
    padding: 6px 11px; border-radius: 999px; box-shadow: var(--shadow);
    background: var(--paper-solid); color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
    animation: pop .35s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
  .chip.ok { background: var(--pine-soft); color: var(--pine); } .chip.ok i { background: var(--pine); }
  .chip.stop { background: var(--cherry-soft); color: #9E2430; } .chip.stop i { background: var(--cherry); }
  .chip.ask { background: var(--saffron-soft); color: #6B4E0E; } .chip.ask i { background: var(--saffron); }
  .chip.pick { background: var(--ink); color: #fff; } .chip.pick i { background: #9FE6CF; }
  .card {
    pointer-events: none; min-width: 230px; max-width: 290px;
    background: var(--paper-solid); border-radius: 16px; box-shadow: var(--shadow-lift);
    padding: 12px 12px 10px; animation: pop .35s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .card h4 { margin: 0 4px 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .card .row { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 10px; font-size: 14px; font-weight: 550; line-height: 1.3; }
  .card .row + .row { margin-top: 2px; }
  .card .row i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .card .row small { margin-left: auto; font-size: 12px; font-weight: 600; opacity: .8; white-space: nowrap; }
  .card .row.pick { background: var(--ink); color: #fff; } .card .row.pick i { background: #9FE6CF; }
  .card .row.ok { background: var(--pine-soft); color: var(--pine); } .card .row.ok i { background: var(--pine); }
  .card .row.stop { color: #9E2430; } .card .row.stop i { background: var(--cherry); }
  @keyframes pop { from { opacity: 0; translate: 0 6px; scale: .96; } to { opacity: 1; translate: 0 0; scale: 1; } }

  /* ---------- Info panel ---------- */
  .panel {
    position: fixed; z-index: 18; top: 78px; right: 14px; bottom: 14px; width: 390px;
    background: var(--paper); border-radius: 20px; box-shadow: var(--shadow-lift);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(0); transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s;
  }
  .panel[hidden] { display: flex; transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }
  .panel-head { padding: 22px 22px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .panel-head h2 { margin: 0; font-size: 23px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 700; }
  .panel-head .path { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--ink-2); background: rgba(29,36,48,.05); padding: 2px 9px; border-radius: 7px; }
  .x {
    margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 10px; border: 0;
    background: rgba(29,36,48,.05); cursor: pointer; display: grid; place-items: center; color: var(--ink-2);
  }
  .x:hover { background: rgba(29,36,48,.1); color: var(--ink); }
  .x svg { width: 16px; height: 16px; }
  .panel-body { padding: 0 22px 22px; overflow: auto; flex: 1; }
  .lead { margin: 0 0 16px; font-size: 16px; line-height: 1.55; color: var(--ink); max-width: 60ch; }
  .who {
    display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px;
    background: var(--pine-soft); color: var(--pine); font-size: 14px; font-weight: 550; margin-bottom: 20px;
  }
  .who svg { width: 17px; height: 17px; flex: none; }
  .panel-body h3 { font-size: 13px; font-weight: 650; color: var(--ink-2); margin: 22px 0 8px; letter-spacing: 0; }
  .items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .items li { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .items .t { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
  .items b { font-weight: 600; font-size: 15px; }
  .items small { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
  .items p { margin: 3px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.45; }
  .badge { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: rgba(29,36,48,.06); color: var(--ink-2); white-space: nowrap; }
  .badge.admin { background: var(--pine-soft); color: var(--pine); }
  .badge.live { background: var(--pine-soft); color: var(--pine); }
  .empty { padding: 16px; border-radius: 14px; border: 1px dashed var(--line-2); color: var(--ink-2); font-size: 14px; line-height: 1.5; }
  .empty b { color: var(--ink); font-weight: 600; }
  .note { margin-top: 18px; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .about { white-space: pre-line; margin: 0 0 4px; padding: 14px 16px; border-radius: 14px; background: rgba(29,36,48,.035); font-size: 14.5px; line-height: 1.55; }
  .panel-foot { padding: 14px 22px 18px; border-top: 1px solid var(--line); }
  .primary {
    width: 100%; border: 0; cursor: pointer; border-radius: 12px; padding: 12px 16px;
    background: var(--ink); color: #fff; font-weight: 600; font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .primary:hover { background: #2C3543; }
  .primary svg { width: 16px; height: 16px; }

  /* ---------- Stories list ---------- */
  .stories {
    position: fixed; z-index: 18; top: 78px; left: 14px; width: 330px; max-height: calc(100vh - 92px);
    background: var(--paper); border-radius: 20px; box-shadow: var(--shadow-lift);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 18px 10px 10px; overflow: auto;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s;
  }
  .stories[hidden] { display: block; transform: translateX(calc(-100% - 30px)); opacity: 0; pointer-events: none; }
  .stories h2 { font-size: 18px; margin: 0 12px 2px; letter-spacing: -0.01em; }
  .stories > p { margin: 0 12px 12px; color: var(--ink-2); font-size: 14px; }
  .story-btn {
    width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
    padding: 11px 12px; border-radius: 12px; display: block;
  }
  .story-btn b { display: block; font-weight: 600; font-size: 15px; }
  .story-btn span { display: block; color: var(--ink-2); font-size: 13.5px; line-height: 1.4; margin-top: 1px; }
  .story-btn:hover { background: rgba(29,36,48,.05); }
  .story-btn[aria-current="true"] { background: var(--pine-soft); }
  .story-btn[aria-current="true"] b { color: var(--pine); }

  /* ---------- How-to guides ---------- */
  .guide-group { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 16px 12px 2px; }
  .who-line { margin: 0 12px 6px; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
  .who-line b { color: var(--ink); font-weight: 600; }
  .story-btn .admin-only { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: rgba(29,36,48,.06); color: var(--ink-2); vertical-align: 1px; }
  #guide { width: 460px; }
  .back {
    border: 0; background: transparent; color: var(--ink-2); font-weight: 550; font-size: 14px; cursor: pointer;
    padding: 4px 8px 4px 2px; margin: -4px 0 8px -2px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px;
  }
  .back:hover { color: var(--ink); background: rgba(29,36,48,.05); }
  .back svg { width: 16px; height: 16px; }
  .g-sub { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.45; }
  .g-facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 0; }
  .fact { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 7px; background: rgba(29,36,48,.06); color: var(--ink-2); white-space: nowrap; }
  .fact.skill { background: var(--pine-soft); color: var(--pine); }
  .fact.time { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
  .g-switch { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 18px 0 4px; }
  .g-switch > span { font-size: 13px; color: var(--ink-2); font-weight: 550; }
  .seg { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(29,36,48,.06); gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-size: 13.5px; font-weight: 550; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--paper-solid); color: var(--ink); box-shadow: 0 1px 2px rgba(29,36,48,.14); }
  ol.g-steps { list-style: none; margin: 14px -10px 0; padding: 0; counter-reset: s; }
  ol.g-steps > li { position: relative; padding: 13px 12px 15px 52px; border-radius: 14px; counter-increment: s; cursor: pointer; transition: background .2s; }
  ol.g-steps > li:hover { background: rgba(29,36,48,.03); }
  ol.g-steps > li::before {
    content: counter(s); position: absolute; left: 13px; top: 12px; width: 27px; height: 27px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 700; background: rgba(29,36,48,.07); color: var(--ink-2);
  }
  ol.g-steps > li.now { background: rgba(31,92,79,.07); }
  ol.g-steps > li.now::before { background: var(--pine); color: #fff; }
  ol.g-steps h4 { margin: 3px 0 4px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
  ol.g-steps p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.5; }
  .cmd { margin-top: 10px; }
  .cmd-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .cmd-box { display: flex; align-items: flex-start; gap: 8px; background: #1D2430; color: #EAF0F1; border-radius: 12px; padding: 9px 9px 9px 14px; }
  .cmd-box code { flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; padding-top: 2px; }
  .cmd-box.say { background: var(--pine-soft); color: var(--pine); }
  .cmd-box.say code { font-family: var(--font); font-size: 15px; font-weight: 550; }
  .copy { flex: none; border: 0; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,.13); color: inherit; }
  .copy:hover { background: rgba(255,255,255,.22); }
  .cmd-box.say .copy { background: rgba(31,92,79,.12); }
  .cmd-box.say .copy:hover { background: rgba(31,92,79,.2); }
  .cmd-note { margin-top: 7px; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .cmd-note q { color: var(--ink); font-weight: 550; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .linkbtn {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 10px;
    background: rgba(29,36,48,.06); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .linkbtn:hover { background: rgba(29,36,48,.1); }
  .linkbtn svg { width: 14px; height: 14px; }
  .msg-card { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; background: var(--pine-soft); }
  .msg-text { flex: 1; min-width: 0; }
  .msg-text b { display: block; color: var(--pine); font-weight: 650; font-size: 15px; line-height: 1.35; }
  .msg-text span { display: block; color: var(--pine-2); font-size: 13px; margin-top: 2px; word-break: break-all; }
  .msg-text small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 6px; line-height: 1.4; }
  .copy.big { padding: 10px 14px; font-size: 14px; background: var(--ink); color: #fff; border-radius: 10px; }
  .copy.big:hover { background: #2C3543; }
  .msg-full { margin-top: 8px; }
  .msg-full summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); padding: 4px 0; }
  .msg-full summary:hover { color: var(--ink); }
  .msg-full pre { margin: 6px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(29,36,48,.04); white-space: pre-wrap; word-break: break-word; font-family: var(--font); font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .cmd-note.how { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: rgba(29,36,48,.04); color: var(--ink); }
  .cmd-note.warn { color: #6B4E0E; }
  .linkbtn.primary-link { background: var(--ink); color: #fff; }
  .linkbtn.primary-link:hover { background: #2C3543; }
  .cmd-box.say code { white-space: pre-wrap; }
  .note-box { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--saffron-soft); color: #5B4410; font-size: 14px; line-height: 1.5; }
  .note-box b { font-weight: 650; }
  dl.basics { margin: 4px 0 0; }
  dl.basics dt { font-weight: 650; font-size: 16px; margin-top: 18px; letter-spacing: -0.005em; }
  dl.basics dt:first-child { margin-top: 6px; }
  dl.basics dd { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }
  dl.basics code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; background: rgba(29,36,48,.06); padding: 1px 5px; border-radius: 5px; color: var(--ink); }
  .foot-row { display: flex; gap: 8px; }
  .foot-row .primary { flex: 1; }
  .secondary {
    flex: 1; border: 0; cursor: pointer; border-radius: 12px; padding: 12px 14px;
    background: rgba(29,36,48,.06); color: var(--ink); font-weight: 600; font-size: 15px;
  }
  .secondary:hover { background: rgba(29,36,48,.1); }

  /* ---------- Skills ---------- */
  .skill-group { margin-top: 6px; }

{

// Low coloured walls around a room, leaving gaps for its doors
function buildRoomWalls(z) {
  const mat = M(z.wall, { r: 0.85 });
  const cap = M(new THREE.Color(z.wall).lerp(new THREE.Color(0xffffff), 0.45).getHex(), { r: 0.8 });
  const H = 0.55, T = 0.16;
  const x0 = z.x - z.w / 2 + T / 2, x1 = z.x + z.w / 2 - T / 2, z0 = z.z - z.d / 2 + T / 2, z1 = z.z + z.d / 2 - T / 2;
  const segs = (a, b, door) => {
    if (!door) return [[a, b]];
    const d0 = door[0] - door[1] / 2, d1 = door[0] + door[1] / 2;
    return [[a, Math.max(a, d0)], [Math.min(b, d1), b]].filter(([p, q]) => q - p > 0.15);
  };
  const sides = { front: ["x", z1, x0, x1], back: ["x", z0, x0, x1], left: ["z", x0, z0, z1], right: ["z", x1, z0, z1] };
  for (const side of z.walls || []) {
    const [axis, at, a, b] = sides[side];
    for (const [p, q] of segs(a, b, (z.doors || {})[side])) {
      const len = q - p, mid = (p + q) / 2;
      const w = axis === "x" ? box(len, H, T, mat, mid, H / 2, at, 0.04) : box(T, H, len, mat, at, H / 2, mid, 0.04);
      const c = axis === "x" ? box(len + 0.02, 0.05, T + 0.06, cap, mid, H + 0.02, at, 0.02) : box(T + 0.06, 0.05, len + 0.02, cap, at, H + 0.02, mid, 0.02);
      world.add(w, c);
    }
  }
}

}

}

  let s = seed * 9301 + 49297;

  [0.12, 1.0, 1.88].forEach((y) => {
    g.add(box(1.92, 0.07, 0.66, frame, 0, y, 0, 0.02));

let liveOverride = null; // an add-on can show other sessions instead (see "Local add-ons")
function applyLive() {
  const data = (liveOverride && liveOverride()) || window.AIOS_LIVE || {};
  const nowSec = Date.now() / 1000;
  const all = new Map();
  for (const h of data.history || []) if (nowSec - h.last < 31 * DAY && !all.has(h.id)) all.set(h.id, { id: h.id, app: h.app, person: h.person, last: h.last, label: h.label, s: null });
  for (const s of (data.sessions || []).filter((x) => nowSec - x.last < 7200)) {
    s.idle = nowSec - s.last > (s.state === "waiting" ? 1800 : 600);
    if (s.room === "auto") { s.room = "yours"; s.target = "__routines"; }
    else if (s.room === "workshop" && ownSkills.some((x) => x.name === s.target)) s.room = "yours";
    const w = all.get(s.id) || { id: s.id, last: 0 };
    Object.assign(w, { app: s.app, person: s.person, last: Math.max(s.last, w.last), label: s.label, s });
    all.set(s.id, w);
  }
  // Open sessions first, then the most recent: one charging pad each
  const list = [...all.values()].sort((a, b) => (b.s ? 1 : 0) - (a.s ? 1 : 0) || b.last - a.last);
  const shown = list.slice(0, SEATS.length);
  const keep = new Set(shown.map((w) => w.id));
  for (const id of [...workers.keys()]) if (!keep.has(id)) { dropWorker(id); liveChanged = true; }
  const taken = new Set([...workers.values()].map((L) => L.seat));
  for (const w of shown) {
    const L = workers.get(w.id);
    if (L) { L.w = w; continue; }
    const seat = SEATS.findIndex((_, i) => !taken.has(i));
    taken.add(seat);
    // A brand-new session walks in through the front door; older ones are already in the lounge
    addWorker(w, seat, !liveFirstLoad && !!w.s && nowSec - (w.s.since || 0) < 300);
  }
  const perSpot = {};
  for (const L of workers.values()) {
    const s = L.w.s;
    const busy = !!(s && !s.idle && s.state !== "waiting");
    let room = "lounge", spot, key = "lounge";
    if (busy) {
      const k = s.room + ":" + s.target;
      const i = (perSpot[k] = (perSpot[k] ?? -1) + 1);
      room = s.room; spot = liveSpot(s, i); key = [s.room, s.target, i].join("|");
    } else {
      const p = SEATS[L.seat].pos;
      spot = spotAt(p.x, p.z, p.x, p.z + 5);
    }
    L.mood = busy ? "work" : s && !s.idle ? "awake" : "sleep";
    L.liveT.visible = !!s;
    L.restT.visible = !s;
    if (s) { L.liveTag.innerHTML = liveTagHtml(L.w); L.liveTag.classList.toggle("idle", !!s.idle); }
    else L.restTag.innerHTML = restTagHtml(L.w, nowSec);
    if (L.key !== key) {
      L.key = key;
      liveChanged = true;
      if (liveFirstLoad || L.place) { L.robot.position.set(spot.x, 0, spot.z); faceTo(L.robot, spot.look); L.queue = []; L.place = false; }
      else L.queue = route(L.room, L.spot, room, spot);

function tickLive(dt, now) {
  liveGroup.visible = !storyState.active;
  for (const L of workers.values()) {
    const r = L.robot;
    // A worker resting on its pad charges: the pad glows softly in its app's colour
    const ring = SEATS[L.seat].ring.material;
    const resting = L.room === "lounge" && !L.queue.length;
    ring.emissive.setHex(resting ? APP_COLORS[L.w.app] || C.pine2 : 0x000000);
    ring.emissiveIntensity = resting ? (L.mood === "sleep" ? 0.25 + Math.sin(now / 900 + L.seat) * 0.15 : 0.5) : 0;
    r.userData.mood = L.queue.length ? "work" : L.mood;
    if (!L.queue.length) { r.userData.walking = 0; continue; }
    const tgt = L.queue[0];
    const dx = tgt.x - r.position.x, dz = tgt.z - r.position.z;
    const dist = Math.hypot(dx, dz);
    const step = (reduce ? 1000 : 5.5) * dt;
    if (dist <= step) {
      r.position.x = tgt.x; r.position.z = tgt.z;
      L.queue.shift();
      if (!L.queue.length) faceTo(r, L.spot && L.spot.look);
    } else {
      r.position.x += (dx / dist) * step;
      r.position.z += (dz / dist) * step;
      let d = Math.atan2(dx, dz) - r.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
      r.rotation.y += d * Math.min(1, dt * 10);
      r.userData.walking = 1;
    }
  }
}

let liveMisses = 0;
function pollLive() {
  const sc = document.createElement("script");
  sc.src = "live.js?t=" + Date.now();
  sc.onload = () => { sc.remove(); liveMisses = 0; applyLive(); setTimeout(pollLive, 1500); };
  sc.onerror = () => { sc.remove(); liveMisses++; applyLive(); setTimeout(pollLive, liveMisses > 2 ? 15000 : 1500); };
  document.head.appendChild(sc);
}

    { text: "OS skills your company never edited are swapped for the new version. If you edited one, you see both side by side and decide.",
      cam: [V(-13, 0, -8), 30],
      async run(k) {
        const b = addTransient(parcel()); b.position.set(ws.x, 0.36, LANE);
        const tpl = desks.filter((d) => d.skill.template);
        const edited = tpl[Math.min(5, tpl.length - 1)];
        await Promise.all(tpl.filter((d) => d !== edited).map((d, i) => k.wait(i * 0.12).then(() => k.glow(d.obj, C.pine2, 0.3, 0.9))));
        if (edited) {
          k.glowOn(edited.obj, C.saffron, 0.3);
          const p = new THREE.Vector3(); edited.obj.getWorldPosition(p);
          k.chip(V(p.x, 3.3, p.z), "You edited this one. Keep yours?", "ask");
        }
        await k.wait(1.6);
      } },
    { text: "Company knowledge, the team, routines and your own skills are never touched.",
      cam: [V(-1, 0, -1), 54],
      async run(k) {
        clearGlows();
        k.chip(V(lib.x, 3.2, lib.z), "Not touched", "ok");
        k.chip(V(TABLE.x, 3.0, TABLE.z), "Not touched", "ok");
        k.chip(V(ROUTINES.x, 5.0, ROUTINES.z), "Not touched", "ok");
        desks.filter((d) => !d.skill.template).forEach((d) => { const p = new THREE.Vector3(); d.obj.getWorldPosition(p); k.chip(V(p.x, 3.1, p.z), "Yours, not touched", "ok"); });
        await k.wait(2);
      } },
    { text: "Everyone starts a new session, and their AI loads the new version.",
      cam: [V(-1, 0, 0), 56],
      async run(k) { k.chip(V(-4.5, 5.2, 2.5), "Updated to " + nextVersion(D.version), "pick"); await k.wait(1.6); } }
  ]
};
function nextVersion(v) { const m = /^(\d+)\.(\d+)/.exec(v || ""); return m ? m[1] + "." + (Number(m[2]) + 1) + ".0" : "the new version"; }

// ---------- Story player ----------
const storyState = { active: null, step: 0, playing: true };
function startStory(id) {
  token++;
  clearTransient(); clearGlows(); resetActors();
  clearSelection(false);
  storyState.active = id; storyState.step = 0; storyState.playing = !reduce;
  document.body.classList.add("story");
  document.querySelectorAll(".story-btn").forEach((b) => b.setAttribute("aria-current", b.dataset.story === id ? "true" : "false"));
  const meta = UI.STORIES.find((s) => s.id === id);
  $("sTitle").textContent = meta.title;
  $("sSteps").innerHTML = STORY[id].map((_, i) => `<button aria-label="Step ${i + 1}" data-i="${i}"></button>`).join("");
  $("player").hidden = false;
  $("stories").hidden = true;
  playStep(0);
}
function stopStory() {
  token++;
  clearTransient(); clearGlows(); resetActors();
  storyState.active = null;
  document.body.classList.remove("story");
  document.querySelectorAll(".story-btn").forEach((b) => b.setAttribute("aria-current", "false"));
  Object.values(zoneTags).forEach((t) => t.classList.remove("on"));
  setFocusClass(null);
  $("player").hidden = true;
  if (mode === "stories") $("stories").hidden = false;
  focusOn(homeTarget(), HOME.dist);
}
function resetActors() {
  shadowsDirty = true; wake(300);
  courier.removeFromParent(); world.add(courier);
  courier.position.copy(HOMEPOS); courier.rotation.set(0, 0, 0); courier.userData.walking = 0;
  asker.visible = false;
  mailBot.position.copy(MAILBOT); mailBot.rotation.y = -Math.PI * 0.6;
  router.rotation.y = 0;
  scan.material.opacity = 0; scan.material.color.setHex(C.pine2);
  gateLight.material.color.setHex(C.pine2); gateLight.material.emissive.setHex(C.pine2);
  inboxPapers.forEach((p) => (p.visible = true));
}
async function playStep(i) {
  const steps = STORY[storyState.active];
  token++;
  const my = token;
  clearTransient(); clearGlows();
  courier.removeFromParent(); world.add(courier);
  storyState.step = i;
  renderPlayer();
  const st = steps[i];
  if (st.cam) {
    const d = st.cam[1] * 1.5 * zoomK * (0.268 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    const c = st.cam[0].clone();
    if (innerWidth / innerHeight < 0.8) c.z += d * 0.12; // keep the action above the player on phones
    focusOn(c, d, 1.2);
  }
  const k = kit(my);
  try {
    await st.run(k);
    await k.wait(reduce ? 0.3 : 1.6);
    if (my !== token) return;
    if (storyState.playing && i < steps.length - 1) playStep(i + 1);
    else if (i === steps.length - 1) { storyState.playing = false; renderPlayer(true); }
  } catch (e) {
    if (e !== CANCEL) console.error(e);
  }
}
function renderPlayer(done) {
  const steps = STORY[storyState.active];
  const i = storyState.step;
  $("sCaption").textContent = steps[i].text;
  $("sCount").textContent = done ? "Done" : `Step ${i + 1} of ${steps.length}`;
  [...$("sSteps").children].forEach((b, j) => { b.className = j < i ? "done" : j === i ? "now" : ""; });
  $("sPlay").setAttribute("aria-label", storyState.playing ? "Pause" : done ? "Play again" : "Play");
  $("sPlayIcon").innerHTML = storyState.playing ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>' : '<path d="M7 4.5v15L19.5 12z"/>';
  $("sPrev").disabled = i === 0;
}
function nextStep() { const n = STORY[storyState.active].length; if (storyState.step < n - 1) playStep(storyState.step + 1); }
function prevStep() { if (storyState.step > 0) playStep(storyState.step - 1); }
function togglePlay() {
  const n = STORY[storyState.active].length;
  if (!storyState.playing && storyState.step === n - 1 && $("sCount").textContent === "Done") { storyState.playing = true; playStep(0); return; }
  storyState.playing = !storyState.playing;
  renderPlayer();
  if (storyState.playing) playStep(storyState.step);
}
$("sNext").addEventListener("click", nextStep);
$("sPrev").addEventListener("click", prevStep);
$("sPlay").addEventListener("click", togglePlay);
$("sClose").addEventListener("click", stopStory);
$("sSteps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { storyState.playing = false; playStep(Number(b.dataset.i)); } });
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-story]");
  if (!b) return;
  if (mode !== "stories") setMode("stories");
  startStory(b.dataset.story);
});

// ---------- Modes ----------
let mode = "howto";
function setMode(m) {
  const was = mode;
  mode = m;
  $("tabExplore").setAttribute("aria-selected", m === "explore");
  $("tabHowto").setAttribute("aria-selected", m === "howto");
  $("tabStories").setAttribute("aria-selected", m === "stories");
  if (storyState.active && m !== "stories") stopStory();
  $("stories").hidden = m !== "stories" || !!storyState.active;
  if (m !== "explore") clearSelection(false);
  if (m === "howto") { if (was !== "howto") UI.showGuideList(); hideHint(); }
  else if (was === "howto") { UI.hideGuides(); unfocus(); }
  if (m === "stories") hideHint();
  if (m === "explore") { showHintOnce(); if (was !== "explore" && !selected) focusOn(homeTarget(), HOME.dist); }
  if (m !== "explore" && !storyState.active && !(m === "howto" && UI.isGuideOpen())) focusOn(homeTarget(), HOME.dist);
}
// Where the camera rests: shifted right of the guide or scene list when one is open on the left.
function homeTarget() {
  const t = HOME.target.clone();
  if (mode !== "explore" && innerWidth / innerHeight >= 0.8 && innerWidth > 1000) t.x -= 4.5;
  return t;
}
// Guides point at rooms: highlight the room and bring it into view, without opening its panel.
function focusZone(key) {
  if (!ZONES[key]) return;
  selected = key;
  Object.entries(zoneTags).forEach(([k, t]) => t.classList.toggle("on", k === key));
  setFocusClass(key);
  const c = zoneCenter(key);
  const tall = innerWidth / innerHeight < 0.8;
  if (!tall && innerWidth > 1100) c.x += 6;
  if (tall) c.z += zoneDist(key) * 0.55;
  focusOn(c, zoneDist(key) * 1.45);
}
function unfocus() {
  selected = null;
  Object.values(zoneTags).forEach((t) => t.classList.remove("on"));
  setFocusClass(null);
  clearSkillGlow();
  focusOn(homeTarget(), HOME.dist);
}
window.AIOS_3D = { perf: () => ({ ...perf, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, objects: (() => { let n = 0; scene.traverse((o) => { if (o.isMesh) n++; }); return n; })() }), setMode, focusZone, unfocus, home: () => { unfocus(); }, openSkill: (n) => openSkill3D(n), selectZone: (k) => { clearSkillGlow(); selectZone(k); } };
// Low power switch
function applyPower() {
  $("powerBtn").setAttribute("aria-pressed", String(lowPower));
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, lowPower ? 1 : 1.5));
  renderer.setSize(innerWidth, innerHeight);
  sun.castShadow = !lowPower;
  shadowsDirty = true;
  wake(300);
}
$("powerBtn").addEventListener("click", () => {
  lowPower = !lowPower;
  try { localStorage.setItem("aios-low-power", lowPower ? "1" : "0"); } catch (e) {}
  applyPower();
});
$("powerBtn").setAttribute("aria-pressed", String(lowPower));
$("tabExplore").addEventListener("click", () => setMode("explore"));
$("tabHowto").addEventListener("click", () => setMode("howto"));
$("tabStories").addEventListener("click", () => setMode("stories"));

// ---------- Idle life ----------
// Robots roll rather than hover. Their faces show a mood: asleep (eyes shut, head down, a dim light),
// awake (looking around, blinking) or at work (typing at a desk).
function idle(now) {
  const t = now / 1000;
  for (const r of robots) {
    const u = r.userData;
    if (reduce) { u.eyes.forEach((e) => (e.scale.y = u.mood === "sleep" ? 0.15 : 1)); continue; }
    const ph = t * 1.6 + u.phase;
    const asleep = u.mood === "sleep";
    r.position.y = 0;
    if (u.walking) u.wheel.rotation.z += 0.25;
    // A slight lean while rolling, a slow breath while asleep
    u.body.scale.y = asleep ? 1 + Math.sin(ph * 0.8) * 0.02 : 1;
    const hx = asleep ? 0.32 + Math.sin(ph * 0.8) * 0.03 : u.seated ? 0.12 + Math.sin(ph * 0.7) * 0.04 : u.walking ? -0.05 : 0;
    u.head.rotation.x += (hx - u.head.rotation.x) * 0.1;
    u.head.rotation.y = asleep ? u.head.rotation.y * 0.95 : Math.sin(ph * 0.35) * (u.seated ? 0.25 : 0.18);
    if (u.typing) {
      u.arms[0].rotation.x = -0.9 + Math.sin(ph * 9) * 0.12;
      u.arms[1].rotation.x = -0.9 + Math.sin(ph * 9 + 1.7) * 0.12;
    } else if (u.walking) {
      u.arms[0].rotation.x = Math.sin(ph * 6) * 0.3;
      u.arms[1].rotation.x = -Math.sin(ph * 6) * 0.3;
    } else {
      u.arms[0].rotation.x *= 0.9; u.arms[1].rotation.x *= 0.9;
    }
    const blink = asleep ? 0.15 : (Math.sin(ph * 0.9 + u.phase) > 0.985) ? 0.15 : 1;
    u.eyes.forEach((e) => (e.scale.y += (blink - e.scale.y) * (asleep ? 0.1 : 1)));
    u.smile.visible = !asleep;
    u.bulb.material.emissiveIntensity = asleep ? 0.08 : 0.35 + (u.mood === "work" ? Math.sin(ph * 3) * 0.15 : 0);
  }
  if (!reduce) {
    h2.rotation.z -= 0.0012;
    for (const ck of deskClocks) ck.userData.h2.rotation.z -= 0.004;
    flag.rotation.y = Math.sin(t * 2) * 0.12;
    towerRing.material.emissiveIntensity = 0.4 + Math.sin(t * 1.5) * 0.15;
    cloud.position.y = 4.6 + Math.sin(t * 0.8) * 0.12;
  }
  for (const [key, rug] of Object.entries(rugs)) {
    const want = key === selected || key === hoverZone ? 0.94 : 1;
    const c = rug.material.color;
    const target = rug.userData.base.clone().multiplyScalar(want);
    c.lerp(target, 0.15);
  }
}

// ---------- Loop ----------
// The office is only redrawn when something changes: the camera, a walking robot, a scene, a glow.
// Then it's redrawn up to 30 times a second. When everything is still, the small idle movements
// (breathing, blinking, typing) run 8 times a second, or not at all in low power mode.
// Shadows and name tags are only redrawn when something actually moves.
function clampTarget() {
  const t = controls.target;
  t.x = Math.max(-24, Math.min(34, t.x));
  t.z = Math.max(BACK - 14, Math.min(18, t.z));
  t.y = Math.max(0, Math.min(4, t.y));
}
let lastFrame = performance.now(), lastDraw = 0, dirtyUntil = 0, shadowsDirty = true, controlsMoving = false;
// Add-on hooks: something to run every frame, another way to draw, and a steady pace (for recording)
const frameHooks = [];
let renderHook = null;
const pace = { always: false, fps: 30 };
function wake(ms = 0) { dirtyUntil = Math.max(dirtyUntil, performance.now() + ms); }
function anyWalking() { for (const L of workers.values()) if (L.queue.length) return true; return false; }
renderer.domElement.addEventListener("pointerdown", () => { controlsMoving = true; wake(300); });
renderer.domElement.addEventListener("pointermove", (e) => { if (e.buttons) wake(300); });
renderer.domElement.addEventListener("wheel", () => wake(600), { passive: true });
controls.addEventListener("change", () => wake(150));
// Simple counters, readable with AIOS_3D.perf() in the browser console, to check how hard the explorer works
const perf = { frames: 0, work: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  const walking = anyWalking();
  const busy = pace.always || now < dirtyUntil || !!camTween || controlsMoving || tweens.size > 0 || walking;
  const gap = busy ? 1000 / pace.fps : lowPower || reduce ? Infinity : 1000 / 8;
  if (now - lastDraw < gap - 4) return;
  const t0 = performance.now(); perf.frames++;
  lastDraw = now;
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  tickTweens(now);
  tickLive(dt, now);
  if (camTween) {
    const p = Math.min(1, (now - camTween.t0) / camTween.dur);
    const e = ease(p);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    camera.position.lerpVectors(camTween.fromP, camTween.toP, e);
    if (p >= 1) camTween = null;
  }
  idle(now);
  for (const f of frameHooks) f(now, dt);
  controlsMoving = controls.update();
  clampTarget();
  if (shadowsDirty || walking || tweens.size > 0) { renderer.shadowMap.needsUpdate = true; shadowsDirty = false; }
  if (renderHook) renderHook(); else renderer.render(scene, camera);
  if (busy) {
    labelRenderer.render(scene, camera);
    for (const L of workers.values()) if (L.liveTag.parentElement) L.liveTag.style.zIndex = "100000";
  }
  perf.work += performance.now() - t0;
}
addEventListener("resize", () => {
  wake(300);
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

// ---------- Local add-ons ----------
// explorer/extras.js (optional, on this computer only) can hook into the 3D office through this.
if (typeof window.AIOS_EXTRAS === "function") {
  try {
    window.AIOS_EXTRAS({
      THREE, scene, camera, renderer, labelRenderer, controls, world, sun, ZONES, desks, shelves, kiosks, workers, robots,
      HOME, homeTarget, focusOn, wake, applyLive, buildKiosks, pace,
      setLive(fn) { liveOverride = fn; for (const id of [...workers.keys()]) dropWorker(id); liveFirstLoad = true; applyLive(); },
      setRender(fn) { renderHook = fn; wake(200); },
      onFrame(fn) { frameHooks.push(fn); },
      setPixelRatio(r) { renderer.setPixelRatio(r); renderer.setSize(innerWidth, innerHeight); wake(200); },
      resetPixelRatio() { applyPower(); },
      shadowsDirty() { shadowsDirty = true; wake(200); }
    });
  } catch (e) { console.error("explorer/extras.js:", e); }
}

// One opening move: the camera settles onto the office.
window.__aiosReady = true;
buildKiosks();
applyLive();
$("loading").classList.add("gone");
focusOn(homeTarget(), HOME.dist, 2.2);
wake(500);
requestAnimationFrame(frame);
</script>
</body>
